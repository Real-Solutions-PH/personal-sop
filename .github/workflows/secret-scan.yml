name: Secret Scan

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so the scanner can diff commits.
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: trufflesecurity/trufflehog@v3.97.4
        with:
          # Only surface verified or unknown-status findings, not every match.
          extra_args: --results=verified,unknown
