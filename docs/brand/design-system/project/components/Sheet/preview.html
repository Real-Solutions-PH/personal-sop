<div class="uf uf-stage">
<div class="uf-sheetwrap" style="height:440px;margin:-20px -16px">
  <div class="uf-sheet">
    <div class="uf-grab"></div>
    <div class="uf-sheet-head"><h4>New expense</h4><button class="uf-ib sm quiet" aria-label="Close"><i data-lucide="x"></i></button></div>
    <div class="uf-sheet-body">
      <div class="uf-field"><label>Amount</label><div class="uf-input num">250.00<span class="suffix">PHP</span></div></div>
      <div class="uf-choices"><button class="uf-pill" aria-pressed="true"><i data-lucide="check"></i>Food</button><button class="uf-pill" aria-pressed="false">Transport</button><button class="uf-pill" aria-pressed="false">Bills</button></div>
      <button class="uf-btn block">Add expense</button>
    </div>
  </div>
</div>
</div>
