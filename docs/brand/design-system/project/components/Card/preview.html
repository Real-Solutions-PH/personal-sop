<!-- @dsCard group="Containers" height=330 -->
<div class="uf uf-stage">
<div class="uf-card">
  <div class="uf-spread"><div style="font:600 17px/24px var(--font-sans)">Push day</div><span class="uf-cap"><span class="uf-dot acc-fit" style="background:var(--fit)"></span> Training</span></div>
  <div class="uf-muted" style="font-size:15px;line-height:22px">Bench press, overhead press, dips. Last done <span class="uf-num" style="font-weight:400;color:var(--foreground)">6</span> days ago.</div>
  <div class="uf-row"><button class="uf-btn small">Start</button><button class="uf-btn small text">View plan</button></div>
</div>
<div class="uf-card flush acc-hab">
  <div class="uf-card-head"><span class="uf-dot"></span><span class="t">Habits</span><span class="uf-cap"><span class="uf-num" style="font-weight:400">2</span> of <span class="uf-num" style="font-weight:400">3</span> today</span></div>
  <div class="uf-line"><span class="uf-check on"><i data-lucide="check"></i></span><div class="grow"><div class="t">No phone after 22:00</div><div class="d"><span class="uf-num" style="font-weight:400">4</span>-day streak</div></div></div>
  <div class="uf-line"><span class="uf-check"></span><div class="grow"><div class="t">Read 10 pages</div><div class="d">Usually done by <span class="uf-num" style="font-weight:400">21:30</span></div></div></div>
</div>
</div>
<script>Unfurl.render(document);(function(){var s=document.createElement('script');s.src='https://unpkg.com/lucide@0.441.0/dist/umd/lucide.min.js';s.onload=function(){lucide.createIcons()};document.head.appendChild(s)})();</script>
