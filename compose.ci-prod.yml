# CI-only overlay for exercising the production images. It is deliberately NOT
# the dev override: base compose.yml keeps the production build targets (the
# frontend standalone runtime, the 4-worker backend CMD). This overlay only
# publishes the ports the base leaves internal and points the containers at the
# host-run Supabase stack (base already maps host.docker.internal:host-gateway).
services:
  prestart:
    environment:
      SUPABASE_URL: http://host.docker.internal:54321

  backend:
    environment:
      SUPABASE_URL: http://host.docker.internal:54321
    ports:
      - "8000:8000"

  frontend:
    # The frontend's server-side middleware reaches the host-run Supabase stack
    # via host.docker.internal; base compose only maps it for prestart/backend.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SUPABASE_URL: http://host.docker.internal:54321
      API_URL: http://backend:8000
    ports:
      - "3000:3000"
